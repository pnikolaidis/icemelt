name: CI

on:
  push:
    branches: [melt, main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    # Pinned (issue #16): a floating :latest once turned CI red on a docs-only
    # merge when a new rule landed upstream. Bump deliberately, matching the
    # version developers run locally.
    container: ghcr.io/realm/swiftlint:0.65.0
    steps:
      - uses: actions/checkout@v4
      - name: Run SwiftLint
        run: swiftlint --strict --reporter github-actions-logging

  build:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Cache SPM dependencies
        uses: actions/cache@v4
        with:
          path: SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('IceMelt.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-
      - name: Build
        run: |
          xcodebuild -project IceMelt.xcodeproj -scheme IceMelt -configuration Release \
            -clonedSourcePackagesDirPath SourcePackages \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            build
